name: DefaultTamer
options:
  bundleIdPrefix: com.defaulttamer
  deploymentTarget:
    macOS: 13.0
packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: 0.15.3
targets:
  DefaultTamer:
    type: application
    platform: macOS
    deploymentTarget: 13.0
    info:
      path: DefaultTamer/Info.plist
      properties:
        CFBundleIdentifier: com.defaulttamer.app
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        CFBundleSignature: "DfTm"
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML Document
            CFBundleTypeRole: Viewer
            CFBundleTypeExtensions:
              - html
              - htm
              - shtml
              - xhtml
              - shtm
              - xhtm
        CFBundleURLTypes:
          - CFBundleURLName: HTTP
            CFBundleURLSchemes:
              - http
          - CFBundleURLName: HTTPS
            CFBundleURLSchemes:
              - https
    sources:
      - DefaultTamer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.defaulttamer.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MACOSX_DEPLOYMENT_TARGET: 13.0
      SWIFT_VERSION: 5.9
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      CODE_SIGN_ENTITLEMENTS: DefaultTamer/DefaultTamer.entitlements
    dependencies:
      - package: SQLite
        product: SQLite
  DefaultTamerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: 13.0
    sources:
      - DefaultTamerTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.defaulttamer.app.tests
      SWIFT_VERSION: 5.9
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DefaultTamer
      - package: SQLite
        product: SQLite
